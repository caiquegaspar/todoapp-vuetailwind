  <body>
    <div id="app"></div>

    <script>
      "use strict";

      const { computed, createApp, nextTick, ref } = Vue;

      // ─── Utilities ────────────────────────────────────────────────────────────

      /** Generate a short unique ID */
      const uid = () =>
        Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

      /** Migrate stored todos to ensure they have all required fields */
      const migrateTodos = (todos) =>
        todos.map((todo, idx) => ({
          id: todo.id || uid(),
          content: todo.content || "",
          done: todo.done ?? false,
          flag: todo.flag || { label: "unflagged", color: "currentColor" },
          order: Number.isFinite(todo.order) ? todo.order : idx,
        }));

      const loadTodos = () => {
        try {
          const raw = JSON.parse(localStorage.getItem("todos")) || [];
          return migrateTodos(Array.isArray(raw) ? raw : []);
        } catch {
          return [];
        }
      };

      // ─── Todo Model ───────────────────────────────────────────────────────────

      class TodoModel {
        constructor() {
          this.id = uid();
          this.content = "";
          this.done = false;
          this.flag = { label: "unflagged", color: "currentColor" };
          this.order = null;
        }
      }

      // ─── DraggableArea ────────────────────────────────────────────────────────

      /**
       * Converts a <ul> list into a draggable/reorderable list.
       * Items are identified by data-todo-id attributes for persistence.
       */
      class DraggableArea {
        itemsArea;
        itemsList;
        itemArea;
        anchorEl;
        itemsArr;
        watcherFns;
        AreaPos;
        orderScheme;
        activeEl;
        listFilter;
        isDragging;

        constructor({ element, anchorEl, callback }) {
          this.itemsArea = document.querySelector(element);
          this.itemsList = this.itemsArea.querySelectorAll("li");
          this.itemArea = this.itemsArea.offsetHeight / this.itemsList.length;
          this.anchorEl = anchorEl;
          this.itemsArr = { value: this.getList() };
          this.watcherFns = [];
          this.listFilter = [];
          this.isDragging = false;

          this.#setGlobalConfig.setArea();
          this.#setGlobalConfig.setObserver();
          this.#setGlobalConfig.setOrderScheme("initial");
          this.#setGlobalConfig.setAttrs(this.itemsArr.value);
          this.#setGlobalConfig.setAnchor();
          this.#setGlobalConfig.setIdxsProxy();

          this.filter = this.filter.bind(this);
          this.reset = this.reset.bind(this);

          if (callback)
            this.watcherFns.push((...args) => callback.apply(this, args));
        }

        #setGlobalConfig = {
          setArea: () => {
            const { left, top } = this.itemsArea.getBoundingClientRect();
            this.AreaPos = { left, top };
          },
          setObserver: () => {
            const observer = new MutationObserver(() => this.#updateList());
            observer.observe(this.itemsArea, { childList: true });
          },
          setOrderScheme: (str) => {
            const schemes = {
              initial: ["start-order", "current-order"],
              filter: ["filter-start", "filter-current"],
            };
            this.orderScheme = schemes[str];
          },
          setAttrs: (arr) => {
            arr.forEach(({ node }, idx) => {
              node.setAttribute(this.orderScheme[0], idx);
              node.setAttribute(this.orderScheme[1], idx);
            });
          },
          setAnchor: () => {
            this.itemsArr.value.forEach(({ node }, idx) => {
              const anchor = this.anchorEl
                ? node.querySelector(this.anchorEl)
                : node;
              if (anchor) anchor.onpointerdown = (e) => this.#dragItem(e, idx);
            });
          },
          setIdxsProxy: () => {
            const self = this;
            this.itemsArr.value = this.getList();
            this.itemsArr = new Proxy(this.itemsArr, {
              set(target, prop, value, receiver) {
                const success = Reflect.set(target, prop, value, receiver);
                if (success && prop === "value")
                  self.watcherFns.forEach((fn) => fn(value));
                return success;
              },
            });
          },
        };

        #setDraggableItem(item) {
          return {
            startOrder: this.orderScheme[0],
            currentOrder: this.orderScheme[1],
            self: item,
            selfArea: this.itemArea,
            selfOrder: Number(item.getAttribute(this.orderScheme[1])),
            parentPos: this.AreaPos,
            posCenter: { left: null, top: null },

            getSelfCoordinates() {
              const topCoordinate =
                this.parentPos.top +
                this.getOrder() * this.selfArea -
                window.scrollY;
              return {
                left: this.parentPos.left,
                top: topCoordinate,
                bottom: topCoordinate + this.self.offsetHeight,
                translate:
                  this.getOrder() * this.selfArea -
                  this.getStartOrder() * this.selfArea,
              };
            },
            previousOrder() {
              return this.selfOrder - 1;
            },
            nextOrder() {
              return this.selfOrder + 1;
            },
            currentPos(e) {
              const { left, top, translate } = this.getSelfCoordinates();
              return {
                posY: e.clientY - top - this.posCenter.top + translate,
                posX: e.clientX - left - this.posCenter.left,
              };
            },
            getStartOrder() {
              return Number(this.self.getAttribute(this.startOrder));
            },
            getOrder() {
              return Number(this.self.getAttribute(this.currentOrder));
            },
            setOrder(num) {
              this.self.setAttribute(this.currentOrder, num);
              return this;
            },
            moveElem(posX, posY) {
              this.self.style.transform = `translate(${posX}px, ${posY}px)`;
              this.self.style.zIndex = "1000";
              return this;
            },
            posByOrder() {
              const { translate } = this.getSelfCoordinates();
              this.self.style.transform = `translate(0px, ${translate}px)`;
              this.self.style.zIndex = "0";
              return this;
            },
            select() {
              this.self.setAttribute("selected", "yes");
              return this;
            },
            unselect() {
              this.self.removeAttribute("selected");
              return this;
            },
            incrementOrder() {
              ++this.selfOrder;
              this.setOrder(this.selfOrder);
              return this;
            },
            decrementOrder() {
              --this.selfOrder;
              this.setOrder(this.selfOrder);
              return this;
            },
            previous() {
              return {
                ...this,
                self: document.querySelector(
                  `[${this.currentOrder}="${this.previousOrder()}"]`,
                ),
              };
            },
            next() {
              return {
                ...this,
                self: document.querySelector(
                  `[${this.currentOrder}="${this.nextOrder()}"]`,
                ),
              };
            },
          };
        }

        #dragItem(e, id) {
          this.isDragging = true;
          const item = this.itemsArea.querySelector(`[start-order="${id}"]`);
          if (!item) return;
          this.activeEl = this.#setDraggableItem(item);
          this.activeEl.posCenter = {
            left: e.clientX - this.AreaPos.left,
            top: e.clientY - this.activeEl.getSelfCoordinates().top,
          };
          this.activeEl.select();
          this.#registerEvents();
        }

        #registerEvents() {
          window.onpointermove = (e) => {
            if (!this.isDragging) return;
            const previousItem = this.activeEl.previous();
            const nextItem = this.activeEl.next();
            const { posY, posX } = this.activeEl.currentPos(e);

            if (
              nextItem.self &&
              e.clientY > nextItem.getSelfCoordinates().top
            ) {
              nextItem.setOrder(this.activeEl.selfOrder).posByOrder();
              this.activeEl.incrementOrder();
            } else if (
              previousItem.self &&
              e.clientY < previousItem.getSelfCoordinates().bottom
            ) {
              previousItem.setOrder(this.activeEl.selfOrder).posByOrder();
              this.activeEl.decrementOrder();
            }

            this.activeEl.moveElem(posX, posY);
          };

          window.onpointerup = () => {
            if (!this.isDragging) return;
            this.activeEl.unselect();
            this.#organizeList();
            this.isDragging = false;
          };
        }

        #organizeList() {
          this.itemsArr.value.forEach(({ node }) =>
            this.#setDraggableItem(node).posByOrder(),
          );
          this.itemsArr.value = this.getList();
        }

        #updateList() {
          this.itemsList = this.itemsArea.querySelectorAll("li");

          const newItems = this.getList().reduce(
            (acc, obj) => {
              const { start_order, filter_start } = obj;
              [start_order, filter_start].forEach((val, i) => {
                if (val !== null) acc.attrsNums[i] = Number(val);
              });
              if (obj.start_order === null) acc.items.push(obj);
              return acc;
            },
            { items: [], attrsNums: Array(2).fill(null) },
          );

          newItems.items.forEach(({ node }) => {
            const attrsArrs = [
              ["start-order", "current-order"],
              ["filter-start", "filter-current"],
            ];
            attrsArrs.forEach((attrs, idx) => {
              if (newItems.attrsNums[idx] === null) return;
              ++newItems.attrsNums[idx];
              attrs.forEach((attr) =>
                node.setAttribute(attr, newItems.attrsNums[idx]),
              );
            });
          });

          this.itemsArr.value = this.getList();
          this.#setGlobalConfig.setArea();
          this.#setGlobalConfig.setAnchor();
        }

        getList() {
          const attrs = [
            "start-order",
            "current-order",
            "filter-start",
            "filter-current",
          ];
          return [...this.itemsList].map((item) => {
            const [start_order, current_order, filter_start, filter_current] =
              attrs.map((a) => item.getAttribute(a));
            return {
              node: item,
              start_order,
              current_order,
              filter_start,
              filter_current,
            };
          });
        }

        filter(filter) {
          if (filter.join() === this.listFilter.join()) return;
          this.reset();
          this.listFilter = filter;

          const { toShow, toHide } = this.itemsArr.value.reduce(
            (acc, obj, idx) => {
              (this.listFilter.includes(idx) ? acc.toShow : acc.toHide).push(
                obj,
              );
              return acc;
            },
            { toShow: [], toHide: [] },
          );

          toShow.forEach(({ node }) => (node.style.display = "block"));
          toHide.forEach(({ node }) => (node.style.display = "none"));

          this.#setGlobalConfig.setArea();
          this.#setGlobalConfig.setOrderScheme("filter");
          this.#setGlobalConfig.setAttrs(toShow);
          toShow.forEach(({ node }) =>
            this.#setDraggableItem(node).posByOrder(),
          );
        }

        reset() {
          this.#setGlobalConfig.setOrderScheme("initial");
          this.listFilter = [];

          this.itemsArr.value.forEach(({ node }) => {
            node.style.display = "block";
            node.removeAttribute("filter-start");
            node.removeAttribute("filter-current");
            const draggable = this.#setDraggableItem(node);
            draggable.setOrder(draggable.getStartOrder()).posByOrder();
          });

          this.itemsArr.value = this.getList();
          this.#setGlobalConfig.setArea();
        }
      }

      // ─── App State ────────────────────────────────────────────────────────────

      const userTheme = localStorage.getItem("theme");
      const systemTheme = window.matchMedia(
        "(prefers-color-scheme: dark)",
      ).matches;

      // Apply theme immediately to avoid flash
      if (userTheme === "dark" || (!userTheme && systemTheme)) {
        document.documentElement.classList.add("dark");
      }

      const periodicity = ref([
        { label: "unflagged", color: "currentColor" },
        { label: "daily", color: "#2563eb" },
        { label: "monthly", color: "#facc15" },
        { label: "unscheduled", color: "#dc2626" },
      ]);

      const todosList = ref(loadTodos());
      const newTodo = ref(new TodoModel());
      const editMode = ref(false);
      const targetTodo = ref(null);
      const tabName = ref("all");
      const tabPos = ref(0);
      const selectedFilter = ref({ label: "no filter", color: "currentColor" });
      const todosArea = ref(null);
      const notifyItems = ref([]);
      const isDarkTheme = ref(
        userTheme === "dark" || (!userTheme && systemTheme),
      );

      // ─── Computed ─────────────────────────────────────────────────────────────

      const filteredTodos = computed(() =>
        todosList.value.reduce(
          (acc, obj, idx) => (filterRules(obj) && acc.push(idx), acc),
          [],
        ),
      );

      // ─── Notification ─────────────────────────────────────────────────────────

      const notifyCases = {
        added: ["Task added!", "bg-green-500"],
        empty: ["Task cannot be empty", "bg-red-500"],
        done: ["Task completed!", "bg-green-500"],
        undone: ["Task is pending", "bg-yellow-500"],
        removed: ["Task removed!", "bg-yellow-500"],
        saved: ["Edit saved!", "bg-green-500"],
        copied: ["Copied to clipboard!", "bg-green-500"],
        inserted: ["Data inserted successfully!", "bg-green-500"],
      };

      const showToast = (msg, color) => {
        const item = { msg, color, show: false };
        notifyItems.value.push(item);
        const idx = notifyItems.value.indexOf(item);

        setTimeout(() => {
          if (notifyItems.value[idx]) notifyItems.value[idx].show = true;
        }, 50);

        setTimeout(() => {
          if (notifyItems.value[idx]) {
            notifyItems.value[idx].show = false;
            setTimeout(() => notifyItems.value.splice(idx, 1), 400);
          }
        }, 4000);
      };

      // ─── Logic ────────────────────────────────────────────────────────────────

      const filterRules = (item) => {
        const tabRules = {
          all: true,
          done: item.done === true,
          undone: item.done === false,
        };
        const filterFlags = {
          "no filter": true,
          unflagged: item.flag?.label === "unflagged",
          daily: item.flag?.label === "daily",
          monthly: item.flag?.label === "monthly",
          unscheduled: item.flag?.label === "unscheduled",
        };
        return (
          (tabRules[tabName.value] ?? true) &&
          (filterFlags[selectedFilter.value.label] ?? true)
        );
      };

      const setTab = (str) => {
        const rules = { all: 0, done: 100, undone: 200 };
        tabName.value = str;
        tabPos.value = rules[str];
      };

      const inputEnterEvent = () => (!editMode.value ? addTodo() : saveTodo());

      const addTodo = () => {
        if (!newTodo.value.content.trim()) {
          showToast(...notifyCases.empty);
          return;
        }
        const todo = {
          ...newTodo.value,
          content: newTodo.value.content.trim(),
          flag: newTodo.value.flag ?? {
            label: "unflagged",
            color: "currentColor",
          },
          order: todosList.value.length,
        };
        todosList.value.push(todo);
        newTodo.value = new TodoModel();
        saveData("added");
      };

      const doneTodo = (todo) => {
        todo.done = !todo.done;
        saveData(todo.done ? "done" : "undone");
      };

      const removeTodo = (todo) => {
        const idx = todosList.value.findIndex((t) => t.id === todo.id);
        if (idx === -1) return;
        todosList.value.splice(idx, 1);
        // Re-number orders after removal
        todosList.value.forEach((t, i) => (t.order = i));
        saveData("removed");
      };

      const editTodo = (todo) => {
        // Keep item in list; just copy it into the input for editing
        editMode.value = true;
        targetTodo.value = todo;
        newTodo.value = { ...todo };
      };

      const saveTodo = () => {
        const idx = todosList.value.findIndex((t) => t.id === newTodo.value.id);
        if (idx !== -1) {
          todosList.value[idx] = {
            ...newTodo.value,
            content: newTodo.value.content.trim(),
          };
        }
        editMode.value = false;
        targetTodo.value = null;
        newTodo.value = new TodoModel();
        saveData("saved");
      };

      const cancelEdit = () => {
        editMode.value = false;
        targetTodo.value = null;
        newTodo.value = new TodoModel();
      };

      /**
       * Called by DraggableArea after a drag completes.
       * Re-orders todosList to match the new visual order using data-todo-id attributes.
       */
      const updateTodos = (newList) => {
        // Sort items by their current visual order
        const sorted = [...newList].sort(
          (a, b) => Number(a.current_order) - Number(b.current_order),
        );

        // Build a lookup map by todo id
        const todosById = Object.fromEntries(
          todosList.value.map((t) => [t.id, t]),
        );

        const reordered = sorted
          .map((item) => {
            const todoId = item.node.dataset.todoId;
            return todoId && todosById[todoId]
              ? { ...todosById[todoId] }
              : null;
          })
          .filter(Boolean);

        // Only apply if we matched all items (prevents partial mismatches)
        if (reordered.length === todosList.value.length) {
          reordered.forEach((t, i) => (t.order = i));
          todosList.value = reordered;
          saveData();
        }
      };

      /**
       * Persist todos to localStorage. Numeric sort on order field.
       */
      const saveData = (action) => {
        const sorted = [...todosList.value].sort((a, b) => a.order - b.order);
        localStorage.setItem("todos", JSON.stringify(sorted));
        if (action) showToast(...notifyCases[action]);
      };

      const changeTheme = () => {
        const cls = document.documentElement.classList;
        cls.toggle("dark");
        const dark = cls.contains("dark");
        isDarkTheme.value = dark;
        localStorage.setItem("theme", dark ? "dark" : "light");
      };

      // ─── Drag-and-drop setup ──────────────────────────────────────────────────

      const setDraggableArea = () => {
        todosArea.value = null;
        if (filteredTodos.value.length > 0) {
          todosArea.value = new DraggableArea({
            element: ".todo_list",
            anchorEl: ".todo_dragndrop",
            callback: updateTodos,
          });
        }
      };

      const onMountedMainConfig = async () => {
        await nextTick();
        setTimeout(setDraggableArea, 500);
      };

      // ─── Data export / import ─────────────────────────────────────────────────

      const dataAccessTab = ref("");
      const dataCode = ref("");

      const encode = (obj) =>
        btoa(JSON.stringify(obj))
          .replace(/\+/g, "-")
          .replace(/\//g, "_")
          .replace(/=/g, "");

      const getData = () => {
        dataCode.value = todosList.value.length ? encode(todosList.value) : "";
        dataAccessTab.value = "getTab";

        if (dataCode.value) {
          navigator.clipboard
            .writeText(dataCode.value)
            .then(() => showToast(...notifyCases.copied))
            .catch(() => {});
        }
      };

      const switchToInsertTab = () => {
        dataCode.value = "";
        dataAccessTab.value = "insertTab";
      };

      const insertData = () => {
        if (!dataCode.value.trim()) {
          showToast(...notifyCases.empty);
          return;
        }
        try {
          const base64 = dataCode.value.replace(/-/g, "+").replace(/_/g, "/");
          const parsed = JSON.parse(atob(base64));
          if (!Array.isArray(parsed)) throw new Error("Invalid data format");
          const migrated = migrateTodos(parsed);
          localStorage.setItem("todos", JSON.stringify(migrated));
          todosList.value = migrated;
          showToast(...notifyCases.inserted);
          dataCode.value = "";
          dataAccessTab.value = "";
        } catch (err) {
          showToast(err.message || "Invalid data", "bg-red-500");
        }
      };

      const copyCode = async () => {
        try {
          await navigator.clipboard.writeText(dataCode.value);
          showToast(...notifyCases.copied);
        } catch {
          showToast("Failed to copy", "bg-red-500");
        }
      };

      const accessData = computed(
        () => window.location.search === "?access-data",
      );

      // ─── Watcher for filter changes ───────────────────────────────────────────

      const mainWatcher = {
        filteredTodos(newVal, oldVal) {
          if (newVal !== oldVal && todosArea.value) {
            todosArea.value.filter(filteredTodos.value);
          }
        },
      };

      // ─── Templates ────────────────────────────────────────────────────────────

      const appTemplate = /*html*/ `
        <main>
          <MainComponent />
          <NotifyComponent />
          <ThemeSwitcherComponent />
        </main>
      `;

      const mainTemplate = /*html*/ `
        <div>
          <header>
            <div class="header_title">
              <ToDoIcon class="todo_icon" />
              <h1>ToDo App</h1>
            </div>

            <div v-if="!accessData" class="header_tabs">
              <ul>
                <li @click="setTab('all')">All</li>
                <li @click="setTab('done')">Done</li>
                <li @click="setTab('undone')">Undone</li>
              </ul>
              <div class="tabs_slider" :style="{ transform: 'translateX(' + tabPos + '%)' }"></div>
            </div>
          </header>

          <form
            v-if="!accessData"
            class="form_container"
            @submit.prevent="editMode ? saveTodo() : addTodo()"
          >
            <input
              v-model="newTodo.content"
              name="newTodo"
              autocomplete="off"
              :placeholder="editMode ? 'Editing task...' : 'New ToDo'"
              @keydown.enter.prevent
              @keyup.enter="inputEnterEvent"
            />

            <ASelect
              class="flags_select"
              :options="periodicity"
              v-model="newTodo.flag"
            >
              <template #option="{ label, color }">
                <NotAllowedIcon v-if="label === 'unflagged'" width="20" />
                <FlagIcon v-else width="20" :iconColor="color" />
                <span>{{ label }}</span>
              </template>
            </ASelect>

            <button v-if="!editMode" type="submit">Add</button>
            <template v-else>
              <button type="submit" class="btn_save">Save</button>
              <button type="button" class="btn_cancel" @click="cancelEdit">✕</button>
            </template>
          </form>

          <!-- Data access panel -->
          <form v-else class="data_access_form" @submit.prevent>
            <div class="data_access_options">
              <button type="button" @click="switchToInsertTab">Insert Data</button>
              <h1>Or</h1>
              <button type="button" @click="getData">Get Data</button>
            </div>

            <Transition name="fade" mode="out-in">
              <div v-if="dataAccessTab === 'insertTab'" class="insert_data">
                <input
                  v-model="dataCode"
                  name="insertData"
                  autocomplete="off"
                  placeholder="Paste encoded data here"
                  @keyup.enter="insertData"
                />
                <button type="button" @click="insertData">Insert</button>
              </div>

              <div v-else-if="dataAccessTab === 'getTab'" class="get_data">
                <div class="code_input">
                  <span class="code_str">{{ dataCode || 'No data' }}</span>
                  <button type="button" @click="copyCode" :disabled="!dataCode">
                    <CopyIcon class="copy_icon" />
                  </button>
                </div>
              </div>
            </Transition>
          </form>

          <template v-if="!accessData">
            <div class="todos_filter">
              <div class="selected_filter">
                <span>{{ selectedFilter.label }}</span>
              </div>

              <ASelect
                :options="[{ label: 'no filter', color: 'currentColor' }, ...periodicity]"
                align="right"
                v-model="selectedFilter"
              >
                <template #select-box>
                  <FilterIcon width="25" />
                </template>
                <template #option="{ label, color }">
                  <FilterOffIcon  v-if="label === 'no filter'"  width="20" />
                  <NotAllowedIcon v-else-if="label === 'unflagged'" width="20" />
                  <FlagIcon       v-else width="20" :iconColor="color" />
                  <span>{{ label }}</span>
                </template>
              </ASelect>
            </div>

            <div class="todo_container">
              <ul class="todo_list">
                <ToDoItem
                  v-for="(todo, idx) in todosList"
                  :todo="todo"
                  :key="todo.id"
                  :editing="editMode && targetTodo && targetTodo.id === todo.id"
                  @doneTodo="doneTodo(todo)"
                  @removeTodo="removeTodo(todo)"
                  @editTodo="editTodo(todo)"
                />
              </ul>
            </div>

            <h4 v-if="!todosList.length" class="empty_msg">Empty list.</h4>

        @apply max-w-2xl mr-auto ml-auto;
      }

      /* ── Header ──────────────────────────────────────────────── */
      header {
        @apply grid grid-cols-3 sm:grid-cols-2 gap-4;
      }

      .header_title {
        @apply flex items-center gap-3;
      }

      .header_title .todo_icon {
        @apply w-[25px] sm:w-[35px] fill-gray-600 dark:fill-gray-400;
      }

      .header_title h1 {
        @apply text-sm sm:text-2xl font-bold inline-block text-gray-600 dark:text-gray-400;
      }

      .header_tabs {
        @apply relative col-span-2 sm:col-span-1;
      }

      .header_tabs ul {
        @apply grid grid-cols-3 relative overflow-hidden;
      }

      .header_tabs li {
        @apply py-2 px-4 sm:text-xl text-gray-600 dark:text-gray-400 cursor-pointer text-center z-20;
      }

      .tabs_slider {
        @apply absolute top-0 left-0 w-1/3 h-full bg-slate-300 dark:bg-slate-900;
        @apply z-10 rounded-lg transition-transform duration-200 ease-linear;
      }

      /* ── Form ────────────────────────────────────────────────── */
      .form_container {
        @apply flex py-5 px-4 justify-center gap-4 items-center;
      }

      .form_container input {
        @apply w-full bg-transparent border-0 border-b-2 rounded-none p-3 focus:outline-none;
        @apply border-b-slate-900 text-gray-600 dark:text-gray-400;
        @apply placeholder:text-gray-500 dark:placeholder:text-gray-500 shadow-2xl;
      }

      .flags_select {
        @apply basis-2/4;
      }

      .form_container > button {
        @apply border-none p-4 px-6 shadow-2xl bg-slate-300 dark:bg-slate-900;
        @apply text-gray-600 dark:text-gray-400 uppercase rounded-lg select-none;
        @apply h-12 px-4 text-sm min-h-[3rem] font-semibold shrink-0;
        @apply disabled:cursor-not-allowed disabled:bg-slate-200 dark:disabled:bg-slate-700;
        @apply transition-colors duration-150;
      }

      .btn_save {
        @apply bg-blue-500 dark:bg-blue-600 text-white !important;
      }

      .btn_cancel {
        @apply bg-slate-200 dark:bg-slate-700 !important;
      }

      /* ── Select ──────────────────────────────────────────────── */
      .select_container {
        @apply text-gray-600 dark:text-gray-400 relative cursor-pointer z-50 select-none;
      }

      .select_box {
        @apply h-full w-full;
      }

      .box {
        @apply h-full w-full flex justify-end items-center border border-slate-900 rounded-md px-3;
      }

      .box > span {
        @apply absolute left-3 bg-white dark:bg-slate-800 transition-all duration-200;
      }

      .box span.active_label {
        @apply px-2 -translate-y-6 -translate-x-2 scale-[.8];
      }

      .selected_option {
        @apply absolute left-3 z-10 truncate max-w-[50%] sm:max-w-[60%] md:max-w-[90%];
      }

      .options_list {
        @apply absolute top-[102%] bg-white dark:bg-slate-800 shadow-2xl border border-slate-900;
        @apply pointer-events-none opacity-0 translate-y-6 transition-all duration-300;
        @apply min-w-full whitespace-nowrap overflow-hidden;
      }

      .options_list.show_options {
        @apply opacity-100 translate-y-0 pointer-events-auto;
      }

      .options_list ul {
        @apply flex flex-col;
      }

      .option_item {
        @apply flex p-2 gap-2 hover:bg-slate-300 dark:hover:bg-slate-900;
      }

      /* ── Data access form ────────────────────────────────────── */
      .data_access_form {
        @apply flex py-5 px-4 justify-center gap-3 flex-col items-center text-center;
      }

      .data_access_form input {
        @apply w-full bg-transparent border-0 border-b-2 rounded-none p-3 focus:outline-none;
        @apply border-b-slate-900 text-gray-600 dark:text-gray-400;
        @apply placeholder:text-gray-500 dark:placeholder:text-gray-500 shadow-2xl;
      }

      .data_access_form button {
        @apply border-none p-4 px-6 shadow-2xl bg-slate-300 dark:bg-slate-900;
        @apply text-gray-600 dark:text-gray-400 uppercase rounded-lg select-none;
        @apply h-12 px-4 text-sm min-h-[3rem] font-semibold shrink-0 flex items-center;
        @apply disabled:cursor-not-allowed disabled:bg-slate-200 dark:disabled:bg-slate-700;
      }

      .data_access_options {
        @apply flex items-center p-5 gap-8;
      }

      .data_access_options > h1 {
        @apply text-sm sm:text-xl font-bold inline-block text-gray-600 dark:text-gray-400;
      }

      .insert_data {
        @apply flex flex-row w-full gap-4 px-3 py-2;
      }

      .get_data {
        @apply flex flex-col items-center gap-4 w-full;
      }

      .code_input {
        @apply w-full bg-transparent border-0 border-b-2 rounded-none px-3 py-2 focus:outline-none;
        @apply flex flex-row justify-between items-center gap-4;
        @apply border-b-slate-900 text-gray-600 dark:text-gray-400 shadow-2xl;
      }

      .code_str {
        @apply truncate;
      }

      .copy_icon {
        @apply w-[25px] sm:w-[30px] fill-gray-600 dark:fill-gray-400;
      }

      /* ── Filter bar ──────────────────────────────────────────── */
      .todos_filter {
        @apply flex justify-end items-center px-4 text-gray-600 dark:text-gray-400;
      }

      .selected_filter {
        @apply px-2 text-sm;
      }

      /* ── Todo list ───────────────────────────────────────────── */
      .todo_container {
        @apply px-1;
      }

      .todo_list {
        @apply flex flex-col my-4;
      }

      .todo_item {
        @apply w-full bg-slate-300 dark:bg-slate-900 border-0 border-l-4 rounded-r-lg;
        @apply shadow-xl relative ml-1 my-2 transition-all duration-300;
      }

      /* Flag color strip on the right — uses CSS variable set via :style binding */
      .todo_item::after {
        content: "";
        @apply absolute top-0 -right-1 h-full w-2 rounded-r-lg;
        background-color: var(--flag-color, transparent);
      }

      .todo_item[selected="yes"] {
        @apply transition-none;
      }

      .todo_content {
        @apply w-full flex justify-between items-center;
      }

      .todo_dragndrop {
        @apply absolute -left-7 text-gray-600 dark:text-gray-400 h-full grid place-items-center;
        @apply touch-none cursor-move z-50;
      }

      .todo_label {
        @apply select-none cursor-pointer text-gray-600 dark:text-gray-400 w-full relative;
        @apply h-full flex items-center p-3 gap-2 truncate;
      }

      .flag_badge {
        @apply inline-block w-2 h-2 rounded-full flex-shrink-0;
      }

      .todo_options {
        @apply flex gap-1 px-3 shrink-0;
      }

      .delete_icon {
        @apply w-[25px] sm:w-[30px] fill-none text-red-500;
      }

      .edit_icon {
        @apply w-[25px] sm:w-[30px] fill-none text-green-500;
      }

      .empty_msg {
        @apply text-center m-0 text-gray-400 py-8;
      }

      /* ── Notifications ───────────────────────────────────────── */
      .notify_container {
        @apply fixed bottom-0 right-0 translate-x-[150%] z-[9999];
      }

      .notify_toast {
        @apply max-w-xs w-80 mb-4 ml-4 mr-4 transition-transform duration-300 ease-in-out;
        @apply text-sm text-white rounded-md shadow-lg;
      }

      .notify_toast > div {
        @apply flex p-4;
      }

      .toast_close {
        @apply inline-flex flex-shrink-0 justify-center items-center h-4 w-4 rounded-md;
        @apply text-white/50 ml-auto hover:text-white transition-all text-sm;
      }

      /* ── Theme switcher ──────────────────────────────────────── */
      .theme_switcher_container {
        @apply fixed bottom-5 left-6;
      }

      #theme_switcher_checkbox {
        @apply opacity-0 absolute;
      }

      .theme_switcher_label {
        @apply cursor-pointer w-[50px] h-[26px] bg-slate-500 dark:bg-slate-900;
        @apply flex items-center justify-between rounded-xl relative scale-150 p-1;
      }

      .theme_switcher_ball {
        @apply cursor-pointer w-[20px] h-[20px] bg-white absolute top-[3.15px] left-[4px];
        @apply rounded-full transition-transform duration-200 ease-linear;
      }

      #theme_switcher_checkbox:checked
        + .theme_switcher_label
        .theme_switcher_ball {
        @apply translate-x-[22px];
      }
    </style>
  </body>
</html>
